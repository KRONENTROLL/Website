<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="../kronentrollsdesign.css">
    <link rel="icon" type="image/png" href="../pictures/favicon.png">
    <script src="../JavaScript/header.js" defer></script>
    <script src="../JavaScript/footer.js" defer></script>
    <script src="../JavaScript/namensliste.js" defer></script>
    <title>Namensliste</title>
</head>

<body>
<my-header></my-header>

<h1>Namensliste</h1>

<label for="nameEingabe">Name hinzufügen:</label>
<input type="text" id="nameEingabe" name="name" placeholder="Gib den Namen hier ein" onkeydown="if(event.key === 'Enter') namensliste()">
<button onclick="namensliste()">Eingeben</button>
<button onclick="zufall()">Zufall</button>
<button onclick="zuruecksetzen()">Zurücksetzen</button>
<ul id="nameAusgabe"></ul>

<p id="anzahlAusgabe"></p>

<p><b id="alleGewaehltAusgabe"></b></p>

<my-footer></my-footer>
</body>

</html>
